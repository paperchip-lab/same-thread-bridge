[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "same-thread-bridge"
version = "0.2.0"
description = "Send WeChat text and images into the Codex Desktop thread already doing the work."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Paper Chip" }]
dependencies = ["cryptography>=42,<46"]
keywords = ["codex", "wechat", "agent", "bridge", "macos"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
]

[project.scripts]
same-thread-bridge = "same_thread_bridge.bridge:main"
same-thread-bind = "same_thread_bridge.bind_current_thread:main"

[tool.setuptools.packages.find]
where = ["src"]
